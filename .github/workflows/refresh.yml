# .github/workflows/refresh.yml
#
# Hourly data refresh for the dsh-suite plugin directory.
#
# Division of labour vs. compat.yml:
#   - THIS workflow (hourly): keeps stars / last_push fresh and ingests newly
#     published dsh-plugin topic repos into data/plugins.json. Cheap
#     (GraphQL batch + search API, no installs) — safe to run every hour.
#   - compat.yml (daily, `0 0 * * *`): the expensive layer — full npm install
#     verification (layer 1 today, layers 2/3 stubbed) — stays daily on purpose.
#     When this hourly refresh mutates data, data/compat-report.json timestamp
#     intentionally lags until the next daily compat run; that skew is fine
#     because compat-report is a derived artifact, not the source of truth.
#
# README / site idempotency: Test-Runner's CI asserts README.md + README.en.md
# and the site artifacts always match data/plugins.json. Because this commit is
# [skip ci]-tagged (no Pages rebuild via push), we regenerate BOTH here —
# scripts/gen-readme.mjs (README tables) and site/build.mjs (site catalog/html) —
# and commit them together with the data.
name: hourly-refresh

on:
  schedule:
    # every hour at :17 UTC
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Discover new plugins (topic diff)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-plugins.mjs

      - name: Refresh stars and last_push (GraphQL batch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-stars.mjs

      - name: Collect ecosystem stats (append time-series point)
        # Appends one JSONL point to data/stats-history.json (idempotent per hour)
        # + advances data/stats-baseline.json for newEntriesToday. Both are
        # committed below with [skip ci].
        run: node scripts/collect-stats.mjs

      - name: Regenerate README tables
        run: node scripts/gen-readme.mjs

      - name: Fetch og cache images (Top 100, idempotent)
        run: node scripts/fetch-og-cache.mjs --limit 100

      - name: Rebuild site artifacts
        run: node site/build.mjs

      - name: Commit changes (only if the data actually changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plugins.json data/deleted-repos.json data/stats-history.json data/stats-baseline.json README.md README.en.md site/
          if git diff --cached --quiet; then
            echo "no data change — nothing to commit"
            exit 0
          fi
          git commit -m "data: hourly refresh [skip ci]"
          # Concurrent commits land on main (compat.yml, x-digest, teammates),
          # so a bare push can be rejected. Rebase onto the latest main and
          # retry a few times before giving up. data/plugins.json is only
          # touched by this workflow and compat.yml, so rebase auto-merges
          # cleanly (different lines: stars vs compat fields).
          for attempt in 1 2 3 4 5; do
            # -X theirs: during rebase, "theirs" is OUR bot commit (fresh data
            # snapshot); a concurrent data commit on main resolves toward ours
            # instead of leaving the retry loop stuck on unmerged files.
            if git pull --rebase -X theirs origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            # clean any half-finished rebase so the next attempt starts fresh
            git rebase --abort 2>/dev/null || true
            echo "push rejected (attempt $attempt) — retrying"
            sleep 5
          done
          echo "push failed after 5 attempts"
          exit 1
