# DSH All-in-One aggregate manifest —— 聚合声明单一真相源。
# 子插件改版后运行: node scripts/aggregate.mjs（重生成 patch + 校验 range 并同步 dependencies）。
meta:
  name: '@dsh-suite/all'
  version: '0.2.0'
  description_en: 'One-command install of the curated first-party DSH plugin suite (store / notify / session-export / team-board / deus / preset-center / themes).'
  description_zh: '一键安装 DeepSeek Harness 第一方最佳插件全家桶（商店 / 通知 / 会话导出 / 任务板 / 神模扳机 / 中文预设 / 皮肤中心）。'
  keywords: [deepseek, harness, dsh, plugin, all-in-one, bundle, 全家桶]
# members: 每行 `<相对仓库根的本地包路径> | <npm 依赖 range>`
# range 取各自 npm 已发布最新版（0.x 锁 minor）；themes 在兄弟仓 dsh-themes。
members:
  - packages/plugins/plugin-manager | ^0.8.2
  - packages/plugins/plugin-notify | ^0.2.0
  - packages/plugins/plugin-session-export | ^0.2.0
  - packages/plugins/plugin-team-board | ^0.1.1
  - packages/plugin-deus | ^0.4.0
  - packages/preset-center | ^0.2.0
  - ../dsh-themes/packages/skin-center | ^0.3.0
output:
  dir: packages/all
  patch: cordis.patch.yml
