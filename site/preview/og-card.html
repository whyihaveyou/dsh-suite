<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #0b0f1a; color: #e6eaf2;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px 90px; overflow: hidden;
  }
  .brand { font-size: 30px; font-weight: 700; color: #34d399; margin-bottom: 34px; }
  .brand b { background: #34d399; color: #052e22; padding: 4px 14px; border-radius: 8px; font-family: monospace; }
  .slogan { font-size: 64px; font-weight: 800; line-height: 1.12; letter-spacing: -.02em; margin-bottom: 26px; }
  .slogan span { color: #34d399; }
  .sub { font-size: 26px; color: #94a3b8; max-width: 880px; line-height: 1.45; margin-bottom: 42px; }
  .badges { display: flex; gap: 16px; }
  .b { padding: 10px 22px; border-radius: 999px; border: 1px solid #243044; background: #151d2e; font-size: 24px; font-weight: 600; }
  .b.accent { border-color: #34d399; color: #34d399; background: rgba(52,211,153,.08); }
</style>
</head>
<body>
  <div class="brand"><b>dsh</b>&nbsp;suite</div>
  <div class="slogan">Stop scrolling the dsh-plugin topic.<br><span>Find plugins that still work.</span></div>
  <div class="sub">The curated, bilingual DeepSeek Harness plugin directory — daily compatibility CI + create-dsh-plugin scaffolder.</div>
  <div class="badges">
    <span class="b">164 plugins</span>
    <span class="b">6 categories</span>
    <span class="b">12 featured</span>
    <span class="b accent">daily compat CI</span>
  </div>
</body>
</html>
